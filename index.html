<style>
:root{
  --bg:#F3ECE1;--card:#FFFEFB;--ink:#1F2620;--muted:#5F675C;--line:rgba(31,38,32,.13);--deep:#2E3A2D;--cream:#F3ECE1;--sage:#E6EDD9;--sage-text:#B9C3A8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:64px}
body{
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}

.hero{text-align:center;padding:38px 20px 22px}
.hero img{width:150px;margin:0 auto 10px}
.hero p{font-size:1.08rem;color:var(--muted)}

/* Jump chips, each in its section colour */
.jump{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.jump ul{list-style:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;max-width:720px;margin:auto}
.jump ul::-webkit-scrollbar{display:none}
.jump a:active{background:var(--deep);color:var(--cream);border-color:var(--deep)}
.jump a{
  display:block;white-space:nowrap;text-decoration:none;
  font-weight:500;font-size:.95rem;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);
}

main{max-width:720px;margin:auto;padding:6px 16px 36px;display:grid;gap:22px}

/* Section card */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.head{display:flex;align-items:center;padding:16px 18px;background:var(--deep);color:var(--cream)}
.head h2{font-size:1.4rem;font-weight:700;line-height:1.25}
.head span{display:block;direction:ltr;text-align:right;font-size:.72rem;font-weight:600;letter-spacing:.16em;color:var(--sage-text)}
.head div{flex:1}

.list{list-style:none;padding:0 18px}
.item{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .name{flex:1;font-size:1.15rem;font-weight:500}
.item .name small{display:block;direction:ltr;text-align:right;font-size:.82rem;font-weight:400;color:var(--muted);line-height:1.4}
.item .price{
  flex:none;background:var(--sage);color:var(--deep);border-radius:999px;padding:5px 14px;
  font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.item .price i{font-style:normal;font-weight:500;font-size:.75rem;margin-inline-start:4px}

.tags{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:18px}
.tags li{padding:9px 18px;border-radius:999px;background:var(--sage);color:var(--deep);font-size:1.08rem;font-weight:500}

.posters{display:grid;gap:12px;padding:14px}
.posters img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.posters img.tall{aspect-ratio:507/900;width:min(100%,380px);margin:0 auto}
.posters img.portrait{aspect-ratio:4/5;width:min(100%,380px);margin:0 auto}

footer{text-align:center;padding:10px 20px 48px;color:var(--muted);font-size:.9rem}
footer .en{direction:ltr;letter-spacing:.28em;font-size:.68rem;margin-top:6px}

.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:720px;margin:0 auto;padding:4px 16px 18px}
@media (min-width:700px){.social{grid-template-columns:repeat(4,1fr)}}
.social a{display:flex;align-items:center;gap:10px;padding:6px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;min-width:0}
.social .h{direction:ltr;unicode-bidi:isolate;font-size:.92rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.ic svg{width:21px;height:21px;fill:#fff}
.ic.wa{background:#25D366}
.ic.ig{background:linear-gradient(45deg,#F9CE34,#EE2A7B 55%,#6228D7)}
.ic.tt{background:#000}
.ic.sc{background:#FFFC00}
.ic.sc svg{fill:#000}
</style>
</head>

/* ترتيب الأقسام + لون كل قسم */
const SECTIONS = [
  {key:"hot",      tab:"الساخنة",        ar:"المشروبات الساخنة", en:"HOT DRINKS"},
  {key:"cold",     tab:"الباردة",        ar:"المشروبات الباردة", en:"COLD DRINKS"},
  {key:"filter",   tab:"المقطرة",        ar:"القهوة المقطرة",    en:"FILTER COFFEE"},
  {key:"jugs",     tab:"الجيكات",        ar:"الجيكات",           en:"JUGS 1L"},
  {key:"soft",     tab:"الغازية",        ar:"المشروبات الغازية", en:"SOFT DRINKS"},
  {key:"bites",    tab:"بسكويت ومعجنات", ar:"بسكويت ومعجنات",    en:"BISCUITS & PASTRIES"},
  {key:"desserts", tab:"الحلويات",       ar:"الحلويات",          en:"DESSERTS", type:"photos"}
];

const item = ([name, en, price]) =>
  `<li class="item"><span class="name">${name}${en ? `<small>${en}</small>` : ""}</span><span class="price">${price}<i>ريال</i></span></li>`;

function body(s){
  if (s.type === "tags")   return `<ul class="tags">${MENU[s.key].map(n => `<li>${n}</li>`).join("")}</ul>`;
  if (s.type === "photos") return `<div class="posters">${DESSERTS.map(([src, alt, cls]) => `<img src="${src}" alt="${alt}"${cls === "tall" ? ' class="tall" width="507" height="900"' : cls === "portrait" ? ' class="portrait" width="720" height="900"' : ' width="900" height="506"'} decoding="async">`).join("")}</div>`;
  return `<ul class="list">${MENU[s.key].map(item).join("")}</ul>`;
}

document.getElementById("jump").innerHTML = SECTIONS.map(s =>
  `<li><a href="#${s.key}">${s.tab}</a></li>`).join("");
document.getElementById("menu").innerHTML = SECTIONS.map(s =>
  `<section class="card" id="${s.key}"><div class="head"><div><h2>${s.ar}</h2><span>${s.en}</span></div></div>${body(s)}</section>`
).join("");

/* على الجوال يفتح التطبيق مباشرة، وعلى الكمبيوتر يفتح الموقع في تبويب جديد */
if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
  document.querySelectorAll(".social a").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
}
